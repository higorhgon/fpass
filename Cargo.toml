[package]
name = "fpass"
version = "2.0.0"
edition = "2024"
description = "TUI rápida para o pass (the standard unix password manager)"
license = "MIT"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hmac = "0.12"
zeroize = "1"
getrandom = "0.2"
